[workspace]
name = "gmsh-ho-curved-nodes"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10"
python-gmsh = "4.15.2.*"
numpy = "*"

[tasks]
# orders 2-4 at h = 0.4, 0.2, 0.1, gmsh's high-order nodes
repro = "python repro.py"
# same meshes, straight nodes moved by a smooth map: rates must be k
control = "python repro.py --control"
# one more level at order 3 (about 150k tets)
fine = "python repro.py --orders 3 --sizes 0.2 0.1 0.05"
# every Mesh.HighOrderOptimize value at order 3: all give the same nodes
optimize = "python repro.py --orders 3 --optimize 0 1 2 3 4"
# regenerate the saved outputs
outputs = "python repro.py > output.txt && python repro.py --control > output-control.txt"
